[package]
name = "omafil-gtk"
version = "0.2.4"
description = "GTK4 front end for omafil"
edition = "2021"

[[bin]]
name = "omafil"
path = "src/main.rs"

[dependencies]
gtk4 = "0.11"
omafil-core = { path = "../core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
