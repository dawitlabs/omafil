name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libarchive-tools
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Frontend
        working-directory: src
        run: |
          bun install --frozen-lockfile
          bun test
          bun run check
          bun run build
      - name: Rust
        working-directory: src-tauri
        run: cargo test -q

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libarchive-tools
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo install tauri-cli --version '^2' --locked
      - name: Frontend dependencies
        working-directory: src
        run: bun install --frozen-lockfile
      - name: Bundle
        working-directory: src-tauri
        run: cargo tauri build --bundles appimage
      - name: Binary tarball and omafil-bin PKGBUILD
        run: |
          version="${GITHUB_REF_NAME#v}"
          install -Dm755 src-tauri/target/release/omafil dist/omafil
          install -Dm644 packaging/omafil.desktop dist/omafil.desktop
          install -Dm644 src-tauri/icons/128x128.png dist/128x128.png
          install -Dm644 src-tauri/icons/32x32.png dist/32x32.png
          install -Dm644 LICENSE dist/LICENSE
          install -Dm644 README.md dist/README.md
          tarball="omafil-${version}-x86_64.tar.gz"
          tar -czf "$tarball" -C dist .
          sed -e "s/@PKGVER@/${version}/g" \
              -e "s/@SHA256@/$(sha256sum "$tarball" | cut -d' ' -f1)/" \
              packaging/bin/PKGBUILD > PKGBUILD
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            omafil-*-x86_64.tar.gz
            PKGBUILD
