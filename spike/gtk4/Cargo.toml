[package]
name = "spike-gtk4"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "omafil"
path = "src/main.rs"

[dependencies]
gtk4 = "0.11"
serde = { version = "1", features = ["derive"] }
notify = "8.2.0"
url = "2.5.8"
rustix = { version = "1.1.4", features = ["fs"] }
tempfile = "3.27.0"
trash = "5.2.7"
zbus = "5.19.0"
sysinfo = "=0.38.0"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
