<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>preview</title>
    <script>
      const GB = 1024 ** 3, HOME = '/home/dave', now = Math.floor(Date.now() / 1000)
      const raw = { [HOME]: [['Documents', 'd', 0, now - 900]],
        [`${HOME}/Documents`]: [['budget.xlsx', 'f', 1048576, now - 600], ['read.pdf', 'f', 15938417, now - 86400], ['notes.txt', 'f', 512, now - 300]] }
      const params = new URLSearchParams(location.search)
      let stored = { pins: [], tags: [{ id: 'design', label: 'Design', color: '#f5342e' }, { id: 'dev', label: 'Dev', color: '#ffc72c' }],
        tagged: { [`${HOME}/Documents/budget.xlsx`]: ['design'], [`${HOME}/Documents/read.pdf`]: ['dev'], '/home/dave/Gone/missing.txt': ['design'] },
        settings: { showHidden: false, theme: params.get('theme') ?? 'light', defaultSort: 'name', defaultDescending: false, vimKeys: Boolean(params.get('vim')) } }
      const mk = (p, [name, kind, size, modified]) => ({ name, path: `${p}/${name}`, entryType: kind === 'd' ? 'directory' : 'file', size, modified })
      const listeners = {}
      const mock = {
        resolve_location: (a) => (a.location === 'home' ? HOME : `${HOME}/${a.location[0].toUpperCase()}${a.location.slice(1)}`),
        list_directory: (a) => { const rows = [...(raw[a.path] ?? [])].sort((x, y) => ((y[1] === 'd') - (x[1] === 'd')) || x[0].localeCompare(y[0]))
          return { path: a.path, total: rows.length,
            crumbs: [HOME, ...a.path.slice(HOME.length).split('/').filter(Boolean).map((_, i, x) => `${HOME}/${x.slice(0, i + 1).join('/')}`)].map((p) => ({ name: p.split('/').filter(Boolean).at(-1), path: p })),
            entries: rows.map((r) => mk(a.path, r)) } },
        rename_path: (a) => { const p = a.path.slice(0, a.path.lastIndexOf('/')), old = a.path.slice(p.length + 1)
          raw[p] = raw[p].map((r) => (r[0] === old ? [a.name, r[1], r[2], r[3]] : r)); return `${p}/${a.name}` },
        describe_path: (a) => { const p = a.path.slice(0, a.path.lastIndexOf('/')), n = a.path.slice(p.length + 1)
          const r = (raw[p] ?? []).find((x) => x[0] === n); if (!r) throw { message: 'gone' }; return mk(p, r) },
        search_files: () => ({ entries: [], truncated: false }),
        watch_directory: () => null, unwatch_directory: () => null,
        load_state: () => stored, save_state: (a) => { stored = a.state; return null },
        open_path: () => null, new_directory: () => `${HOME}/x`, trash_paths: () => null, transfer_paths: () => null,
        list_drives: () => [{ name: 'dave', mountPoint: '/', path: HOME, totalBytes: 500 * GB, availableBytes: 330 * GB, isRemovable: false, isReadOnly: false, isMounted: true, device: '/dev/mapper/root' }, ...(params.get('usb') ? [{ name: 'STICK', mountPoint: '', path: '', totalBytes: 64 * GB, availableBytes: 0, isRemovable: true, isReadOnly: false, isMounted: false, device: '/dev/sdb1' }] : [])],
        list_recent_files: () => [],
        inspect_path: (a) => { const p = a.path.slice(0, a.path.lastIndexOf('/')), n = a.path.slice(p.length + 1); const r = (raw[p] ?? []).find((x) => x[0] === n) ?? [n, 'd', 0, now]
          return { name: n, path: a.path, entryType: r[1] === 'd' ? 'folder' : 'file', size: r[2], itemCount: 1, modified: r[3], created: r[3], preview: n.endsWith('.txt') ? 'hello' : null, previewTruncated: false, mediaPreview: null, mediaType: null, mode: 0o644, owner: 'dave', group: 'dave' } },
        set_permissions: () => null,
        list_openers: () => [{ id: 'nvim.desktop', name: 'Neovim', isDefault: true }, { id: 'code.desktop', name: 'Visual Studio Code', isDefault: false }, { id: 'gimp.desktop', name: 'GIMP', isDefault: false }],
        open_with: () => null, set_default_opener: () => null, pdf_preview: () => null, report_client_error: () => null,
        mount_drive: () => '/run/media/dave/STICK', unmount_drive: () => null, eject_drive: () => null,
        startup_path: () => null, theme_icons: () => null,
        read_omarchy_theme: () => (params.get('omarchy') ? { mode: 'dark', accent: '#f38d70', selection: '#403e41', muted: '#72696a', background: '#2c2525',
          dark_background: '#211c1c', darker_background: '#1a1616', lighter_background: '#3d2f2a', foreground: '#e6d9db', dark_foreground: '#72696a',
          light_foreground: '#c3b7b8', red: '#fd6883', yellow: '#f9cc6c', blue: '#85dacc', green: '#adda78' } : null),
      }
      window.__TAURI_INTERNALS__ = { metadata: { currentWindow: { label: 'main' }, currentWebview: { label: 'main', windowLabel: 'main' } }, plugins: {},
        transformCallback: (cb) => { const id = Math.floor(Math.random() * 1e9); window[`_${id}`] = cb; return id },
        invoke: (c, a) => { if (c === 'plugin:event|listen') { listeners[a.event] = a.handler; return Promise.resolve(1) }
          if (c === 'plugin:event|unlisten') return Promise.resolve(null)
          try { return Promise.resolve(mock[c] ? mock[c](a ?? {}) : []) } catch (e) { return Promise.reject(e) } } }
      window.__tagged = () => JSON.stringify(stored.tagged)
      const row = (n) => [...document.querySelectorAll('[data-path]')].find((r) => r.textContent.trim().startsWith(n))
      const acts = {
        nav: (n) => [...document.querySelectorAll('button')].find((b) => b.textContent.trim().startsWith(n))?.click(),
        key: (k) => document.querySelector('.file-list')?.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true })),
        ctx: (n) => row(n)?.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, clientX: 420, clientY: 240 })),
        click: (n) => row(n)?.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 1 })),
        rename: (spec) => { const [from, to] = spec.split('>')
          row(from)?.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 1 }))
          setTimeout(() => { document.querySelector('.file-list')?.dispatchEvent(new KeyboardEvent('keydown', { key: 'F2', bubbles: true }))
            setTimeout(() => { const i = document.querySelector('.file-row__rename'); i.value = to
              i.dispatchEvent(new Event('input', { bubbles: true }))
              i.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }))
              setTimeout(() => { document.title = window.__tagged() }, 400) }, 120) }, 120) },
      }
      addEventListener('load', () => { const steps = params.get('go'); if (!steps) return
        let d = 700; for (const s of steps.split('|')) { const i = s.indexOf(':'); const [fn, arg] = i < 0 ? [s, ''] : [s.slice(0, i), s.slice(i + 1)]
          setTimeout(() => acts[fn]?.(arg), d); d += 900 } })
    </script>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
